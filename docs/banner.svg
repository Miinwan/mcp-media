<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
  <title id="t">media</title>
  <desc id="d">On-device take detection, shot description and text-to-shot search for Premiere Pro editors</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1a"/>
      <stop offset="1" stop-color="#161b2e"/>
    </linearGradient>
    <linearGradient id="wave" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="520" y2="0">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="0.55" stop-color="#3fb6ff"/>
      <stop offset="1" stop-color="#36e2b4"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#36e2b4"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26304d"/>
      <stop offset="1" stop-color="#1b2238"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" fill="url(#bg)"/>

  <!-- film strip -->
  <g transform="translate(700 48)">
    <rect x="0" y="0" width="520" height="180" rx="10" fill="#10152a" stroke="#2a3456"/>
    <g fill="#2a3456">
      <rect x="18" y="10" width="14" height="10" rx="2"/><rect x="58" y="10" width="14" height="10" rx="2"/>
      <rect x="98" y="10" width="14" height="10" rx="2"/><rect x="138" y="10" width="14" height="10" rx="2"/>
      <rect x="178" y="10" width="14" height="10" rx="2"/><rect x="218" y="10" width="14" height="10" rx="2"/>
      <rect x="258" y="10" width="14" height="10" rx="2"/><rect x="298" y="10" width="14" height="10" rx="2"/>
      <rect x="338" y="10" width="14" height="10" rx="2"/><rect x="378" y="10" width="14" height="10" rx="2"/>
      <rect x="418" y="10" width="14" height="10" rx="2"/><rect x="458" y="10" width="14" height="10" rx="2"/>
      <rect x="498" y="10" width="14" height="10" rx="2"/>
      <rect x="18" y="160" width="14" height="10" rx="2"/><rect x="58" y="160" width="14" height="10" rx="2"/>
      <rect x="98" y="160" width="14" height="10" rx="2"/><rect x="138" y="160" width="14" height="10" rx="2"/>
      <rect x="178" y="160" width="14" height="10" rx="2"/><rect x="218" y="160" width="14" height="10" rx="2"/>
      <rect x="258" y="160" width="14" height="10" rx="2"/><rect x="298" y="160" width="14" height="10" rx="2"/>
      <rect x="338" y="160" width="14" height="10" rx="2"/><rect x="378" y="160" width="14" height="10" rx="2"/>
      <rect x="418" y="160" width="14" height="10" rx="2"/><rect x="458" y="160" width="14" height="10" rx="2"/>
      <rect x="498" y="160" width="14" height="10" rx="2"/>
    </g>
    <rect x="16" y="32" width="152" height="116" rx="6" fill="url(#frame)"/>
    <rect x="184" y="32" width="152" height="116" rx="6" fill="url(#frame)" stroke="#3fb6ff" stroke-width="2"/>
    <rect x="352" y="32" width="152" height="116" rx="6" fill="url(#frame)"/>
    <!-- face box in the highlighted frame -->
    <rect x="236" y="56" width="48" height="56" rx="6" fill="none" stroke="#36e2b4" stroke-width="2" stroke-dasharray="6 4"/>
    <circle cx="260" cy="80" r="14" fill="#36e2b4" opacity="0.25"/>
    <!-- slate in first frame -->
    <g transform="translate(52 62)">
      <rect x="0" y="16" width="80" height="44" rx="4" fill="#0b0f1a" stroke="#56628a"/>
      <path d="M0 16 L80 16 L74 2 L-4 6 Z" fill="#e8ecf8"/>
      <path d="M12 4 L20 16 M32 3 L40 16 M52 2 L60 16" stroke="#0b0f1a" stroke-width="5"/>
    </g>
    <!-- mountains in last frame -->
    <path d="M362 138 L402 88 L428 116 L450 96 L494 138 Z" fill="#3b4670"/>
    <circle cx="470" cy="66" r="10" fill="#7c5cff" opacity="0.6"/>
  </g>

