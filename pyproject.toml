[project]
name = "dailies"
version = "0.1.0"
description = "Dailies: on-device footage review for Premiere Pro and After Effects MCP servers: selects scoring and export, takes from on-set voice cues, shot description, text-to-shot search, square and vertical framing."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Miinwan" }]
keywords = ["whisper", "siglip", "video-editing", "mcp", "premiere-pro", "apple-silicon", "mlx"]
dependencies = [
    "faster-whisper>=1.2.1",
    "msgpack>=1.2.3",
    "numpy",
    "onnxruntime>=1.20",
    "opencv-python-headless>=4.10",
    "tokenizers>=0.20",
    "zstandard>=0.25.0",
]

[project.urls]
Homepage = "https://github.com/Miinwan/dailies"
Repository = "https://github.com/Miinwan/dailies"
Changelog = "https://github.com/Miinwan/dailies/blob/main/docs/DEVLOG.md"

[project.scripts]
dailies = "dailies.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dailies"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
# Pinned to the versions already in the local cache to avoid re-downloads on slow networks; upgrade deliberately
constraint-dependencies = ["onnxruntime==1.30.0", "av==19.0.1", "ctranslate2==4.8.2"]
