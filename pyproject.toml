[project]
name = "media"
version = "0.1.0"
description = "Năng lực media cho MCP Premiere và After Effects: cắt take theo khẩu lệnh, mô tả shot, bố cục bản vuông, dọc."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = [
    "wcut",
]

[project.scripts]
media = "media.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/media"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
# Theo bản đã chốt của W.cut (quyết định 017 của W.cut) để khỏi tải lại khi mạng chậm
constraint-dependencies = ["onnxruntime==1.30.0", "av==19.0.1", "ctranslate2==4.8.2"]

[tool.uv.sources]
# Dùng lại phần nghe, quét, chấm hình của W.cut làm thư viện (brief MCP Adobe: phần media không viết hai lần)
wcut = { path = "../../W.cut", editable = true }
