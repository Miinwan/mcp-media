[project]
name = "media"
version = "0.1.0"
description = "Năng lực media cho MCP Premiere và After Effects: cắt take theo khẩu lệnh, mô tả shot, bố cục bản vuông, dọc."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = [
    "faster-whisper>=1.2.1",
    "numpy",
    "onnxruntime>=1.20",
    "opencv-python-headless>=4.10",
    "tokenizers>=0.20",
]

[project.scripts]
media = "media.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/media"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
# Chốt theo bản đã có trong cache máy để khỏi tải lại khi mạng chậm; nâng có chủ đích khi cần
constraint-dependencies = ["onnxruntime==1.30.0", "av==19.0.1", "ctranslate2==4.8.2"]
