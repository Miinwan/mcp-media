[project]
name = "media"
version = "0.1.0"
description = "On-device media intelligence for Premiere Pro and After Effects MCP servers: takes from on-set voice cues, shot description, text-to-shot search, square and vertical framing."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "All rights reserved" }
authors = [{ name = "Miinwan" }]
keywords = ["whisper", "siglip", "video-editing", "mcp", "premiere-pro", "apple-silicon", "mlx"]
dependencies = [
    "faster-whisper>=1.2.1",
    "numpy",
    "onnxruntime>=1.20",
    "opencv-python-headless>=4.10",
    "tokenizers>=0.20",
]

[project.urls]
Homepage = "https://github.com/Miinwan/mcp-media"
Repository = "https://github.com/Miinwan/mcp-media"
Changelog = "https://github.com/Miinwan/mcp-media/blob/main/docs/DEVLOG.md"

[project.scripts]
media = "media.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/media"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
# Pinned to the versions already in the local cache to avoid re-downloads on slow networks; upgrade deliberately
constraint-dependencies = ["onnxruntime==1.30.0", "av==19.0.1", "ctranslate2==4.8.2"]
